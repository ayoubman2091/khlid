# Netlify config — audit item #16. Delete this file if the site is NOT deployed on Netlify.
#
# Every real route is prerendered to its own dist/<route>/index.html by scripts/prerender.ts
# (see audit item #13), so deep links like /services/dallage or /guides/prix-renovation-maison
# resolve directly to real, route-specific static files — Netlify's default "pretty URL"
# resolution (serving path/index.html for a request to /path or /path/) handles this with no
# redirect rules needed. dist/404.html (also generated by the prerender step) is Netlify's
# recognized convention for a custom error page: it's served automatically, with a real HTTP
# 404 status, for any path that matches no file — not a silent 200 on missing content.

[build]
  command = "npm run build"
  publish = "dist"
