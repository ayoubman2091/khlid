# Build the site and publish dist/ to Hostinger on every push to main.
#
# Why this exists: Hostinger shared hosting serves the static dist/ output and runs no build
# step of its own (see DEPLOYMENT.md). Before this workflow, `git push` changed nothing in
# production — someone had to run `npm run build` locally and upload dist/ by hand, so the
# repo and the live site drifted apart silently. This closes that gap.
#
# SECRETS REQUIRED (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    e.g. ftp.your-domain.com  (hPanel -> Files -> FTP Accounts)
#   FTP_USERNAME
#   FTP_PASSWORD
# Until all three exist the deploy step fails; build + checks still run, so the workflow is
# safe to merge before the secrets are added.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation-only commits don't change a single byte of dist/, so they don't need a
      # deploy. This repo carries a lot of them (audits, experiment log, manifests).
      - '**.md'
      - 'seo/**'
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Wipe public_html before uploading (use once, for the first run)'
        type: boolean
        default: false

# Never let two deploys write to public_html at the same time. Queue instead of cancelling:
# a half-uploaded site is worse than a slightly delayed one.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Exposed as env so the FTP step can test for it. The `secrets` context is not available
    # in a step-level `if:`, but `env` is — this is the standard workaround.
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1 shallow clone. scripts/generate-seo-files.ts
          # derives each sitemap <lastmod> from `git log` on the files behind that route; with a
          # shallow checkout git returns the HEAD commit for every path, so all 26 dates come out
          # identical and the generator now fails the build on purpose. Verified locally.
          fetch-depth: 0
          # Build the CURRENT tip of main, not the SHA that triggered this run. The concurrency
          # group below keeps one run in flight and cancels the queued middles, so a burst of
          # pushes leaves the LAST-QUEUED run to deploy - and that run's own SHA can already be
          # several commits behind. Not hypothetical: on 2026-09-14 eight commits were pushed in
          # thirteen seconds, six runs were cancelled, and production was built from d784176
          # while main had moved on to c2714d4. The live sitemap therefore still carried the old
          # generator's 26 identical lastmod values and the case-study content never shipped.
          ref: main

      # Node 22 specifically: package.json runs `node scripts/*.ts` with no loader, which
      # relies on native TypeScript type-stripping. That is unflagged from 22.18 onward.
      # Anything older fails on the first build script.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      # generate:images -> tsc -b -> SSR bundle -> robots.txt/sitemap.xml -> client bundle
      # -> prerender every route to real HTML. Reads .env.production (committed, non-secret).
      - name: Build
        run: npm run build

      - name: SEO audit
        run: npm run seo:audit

      # Belt and braces. The audit checks the HTML; these check the things that would silently
      # break the server config or ship a broken artifact.
      - name: Verify deploy artifact
        run: |
          set -euo pipefail
          test -f dist/index.html          || { echo "::error::dist/index.html missing"; exit 1; }
          # .htaccess is a dotfile and the single most fragile part of this deploy. If it does
          # not reach the server we lose www->non-www, the /projets 301 and ErrorDocument 404.
          test -f dist/.htaccess           || { echo "::error::dist/.htaccess missing"; exit 1; }
          test -f dist/sitemap.xml         || { echo "::error::dist/sitemap.xml missing"; exit 1; }
          test -f dist/robots.txt          || { echo "::error::dist/robots.txt missing"; exit 1; }
          # Google Search Console verification files live in public/ and must survive the build.
          ls dist/google*.html >/dev/null   || { echo "::error::GSC verification file missing"; exit 1; }
          routes=$(find dist -name index.html | wc -l)
          echo "prerendered routes: $routes"
          [ "$routes" -ge 26 ] || { echo "::error::expected >=26 prerendered routes, got $routes"; exit 1; }
          echo "artifact OK"

      # Publishes the built output to a `production` branch containing dist/ at its root.
      # This is the zero-credential deploy path: point hPanel -> Git at the `production`
      # branch instead of `main` and Hostinger pulls a ready-built site, with no Node build
      # on the server and no FTP password stored in this repo. `main` must NOT be used as
      # the Hostinger source — dist/ is gitignored there, so a pull of main deploys raw
      # source and the site breaks.
      #
      # A fresh `git init` each run keeps the branch at exactly one commit, so the repo does
      # not grow with every build. The force-push is intentional and only ever targets
      # `production` — never main.
      - name: Publish built output to the production branch
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b production
          git add -A
          git ls-files --error-unmatch .htaccess >/dev/null \
            || { echo "::error::.htaccess not staged for the production branch"; exit 1; }
          git commit -q -m "build from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            production
          echo "published $(git ls-files | wc -l) files to the production branch"

      # Production reality check - this step decides whether the deploy actually happened.
      #
      # Every step above can be green while the live site is untouched; that is exactly the
      # state this repository was in on 2026-09-14, and it is why an earlier report could claim
      # a successful deploy that had not reached a single visitor. Build correctness is already
      # covered by "Verify deploy artifact"; this asks the only question that matters after an
      # upload - does the domain serve THIS build? A fingerprinted asset filename answers it
      # unambiguously: it exists only in this build, so a 200 cannot come from a cache or from
      # the previous deploy.
      - name: Verify production serves this build
        run: |
          set -euo pipefail
          origin=$(grep -o '<loc>[^<]*' dist/sitemap.xml | head -1 | sed 's|<loc>||' | sed 's|/$||')
          asset=$(ls dist/assets/*.js | head -1 | sed 's|dist/||')
          echo "checking $origin/$asset"
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'rk-deploy-check' "$origin/$asset" || true)
            if [ "$code" = "200" ]; then echo "production is serving this build"; exit 0; fi
            echo "attempt $i: HTTP $code - waiting"
            sleep 20
          done
          echo "::error::production does not serve this build - $origin/$asset returned $code. The build and the production branch are correct, so the upload target is wrong: set server-dir to the real document root (hPanel -> Files -> File Manager), or point hPanel -> Git at the production branch."
          exit 1

      # Optional second path. Skipped entirely unless an FTP_SERVER secret exists, so the
      # workflow stays green for whoever uses the production-branch route instead.
      # KNOWN BROKEN TARGET - server-dir is wrong, and the step cannot tell.
      #
      # 2026-09-14, measured end to end: a clean-slate run uploaded all 118 files into
      # public_html/ and reported success, yet every asset filename from that build returned 404
      # on the live domain while the previous build's assets still returned 200, and
      # /.ftp-deploy-sync-state.json - written by this action at the top of the upload target -
      # is not reachable either. public_html/ is therefore NOT the document root serving this
      # domain. On Hostinger that is the signature of an addon/secondary domain, whose root is
      # domains/<domain>/public_html/ while public_html/ belongs to the account's primary
      # domain. Uploading into the wrong directory succeeds at the FTP level every time.
      #
      # Fix: read the real document root in hPanel -> Files -> File Manager and set server-dir
      # to it. Do not guess the path here: dangerous-clean-slate wipes whatever it points at.
      #
      # continue-on-error stays until then, because the production-branch publish above is the
      # path that works and a permanently red job hides real build failures. The honest verdict
      # now comes from the production check below, which tests the live site instead of trusting
      # this step's exit code.
      - name: Deploy to Hostinger over FTP
        continue-on-error: true
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/
          # Incremental by default: the action keeps a state file on the server and uploads
          # only what changed. The one-shot clean slate is exposed as a manual input so the
          # first run can clear whatever the old hand-uploads left behind.
          dangerous-clean-slate: ${{ inputs.clean_slate == true }}
          # Defaults already skip .git*/node_modules. .htaccess does NOT match .git* and is
          # uploaded normally — do not add a broader dotfile exclusion here.
          log-level: minimal
